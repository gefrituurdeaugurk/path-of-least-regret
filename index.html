<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NavMesh Pathfinding Demo</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="wrap">
    <canvas id="scene" width="1280" height="720"></canvas>
    <div class="panel">
      <div class="toggle" role="group" aria-label="Mode">
        <button id="editBtn" aria-pressed="true">Edit</button>
        <button id="playBtn" aria-pressed="false">Play</button>
      </div>
      <button id="resetBtn" class="secondary">Reset shape</button>
      <button id="obstacleBtn" class="secondary">Add obstacle</button>
      <button id="clearObstaclesBtn" class="secondary">Clear obstacles</button>
      <span class="pill">Edit: click to add points, click first point to close, drag points, Backspace remove, '='
        splits edge. Drag an obstacle to move it, right-click it to remove.</span>
      <label><input type="checkbox" id="toggleMesh" checked> Show navmesh</label>
      <label><input type="checkbox" id="togglePortals"> Show portals</label>
      <label><input type="checkbox" id="toggleWaypoints" checked> Show waypoints</label>
  <label><input type="checkbox" id="optSmooth" checked> Smooth</label>
  <label>Smooth iters <input type="number" id="optSmoothIter" min="1" max="5" value="1" class="num"></label>
  <label>Clearance <input type="number" id="optClearance" min="0" max="60" step="2" value="0" class="num"></label>
  <label><input type="checkbox" id="optDebug" checked> Debug data</label>
      <button id="randomBtn">Random target</button>
      <span class="pill">A* on triangles + Robust Funnel</span>
    </div>
    <div class="panel">
      <label>Directions
        <select id="dirCount">
          <option value="4">4</option>
          <option value="8" selected>8</option>
          <option value="16">16</option>
        </select>
      </label>
      <label>Hysteresis <input type="number" id="dirHysteresis" min="0" max="40" step="5" value="10" class="num"></label>
      <label>Horizon layer
        <select id="horizonLayer">
          <option value="ground">Ground</option>
          <option value="balcony">Balcony</option>
        </select>
      </label>
      <label><input type="checkbox" id="toggleHorizons" checked> Show horizons</label>
      <label><input type="checkbox" id="editHorizons"> Drag horizons</label>
      <span class="pill" id="actorReadout">facing &mdash; &middot; scale &mdash;</span>
    </div>
    <div class="panel">
      <label>Speed <input type="number" id="moveSpeed" min="20" max="600" step="10" value="160" class="num"></label>
      <label>Ease in/out <input type="number" id="moveEase" min="0" max="240" step="10" value="60" class="num"></label>
      <label>Easing
        <select id="moveEasing">
          <option value="smoothstep" selected>smoothstep</option>
          <option value="sine">sine</option>
          <option value="linear">linear</option>
        </select>
      </label>
      <label><input type="checkbox" id="perspectiveSpeed" checked> Perspective speed</label>
      <span class="pill">Speed is quoted at scale 1; the horizon layer scales it</span>
    </div>
    <div id="error" class="error"></div>
    <div class="hint" id="hint"></div>
  </div>

  <script type="module" src="demo/main.js"></script>
</body>

</html>
